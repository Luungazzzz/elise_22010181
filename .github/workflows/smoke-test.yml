name: Katalon Smoke Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Katalon Studio GitHub Action
        uses: katalon-studio/katalon-studio-github-action@v4.0
        with:
          version: '11.1.3'
          projectPath: '${{ github.workspace }}'
          args: >
            -noSplash 
            -retry=1
            -testSuitePath="Test Suites/TS_smoke_test/TS_smoke_test"
            -apiKey=${{ secrets.KATALON_API_KEY }}
            -projectId=${{ secrets.KATALON_PROJECT_ID }}
            -browserType="Chrome (headless)"
            -executionProfile="default"